name: Mobile release builds

# Builds the iOS and Android Release apps on GitHub's macOS runners, which carry a current Xcode.
# The ios and android jobs build unsigned (Android debug-signed) on every change, pull requests included.
# The ios-testflight job signs the iOS app and uploads it to TestFlight, on master pushes and manual runs on master only, and
# only when the signing secrets and variables exist (forks, pull requests and an unconfigured repo skip it, green).
# Setup: docs/deploy/testflight.md.
# The API address comes from the variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'
      - '.github/scripts/asc_profile.rb'
  pull_request:
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'
      - '.github/scripts/asc_profile.rb'

permissions:
  contents: read

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.invalid/' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # .NET for iOS requires the exact Xcode major.minor it was built for, and actool needs a matching
          # simulator runtime. Workload set 10.0.112 ships iOS 26.5, which requires Xcode 26.6.
          # Bump both together when moving to a newer workload set.
          xcode-version: '26.6'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android --version 10.0.112
      - name: Build iOS (Release, device, unsigned)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:EnableCodeSigning=false
          -p:ArchiveOnBuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-ios/ios-arm64/publish/
          if-no-files-found: warn

  android:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android
      - name: Build Android (Release AAB, debug-signed)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-android -c Release
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:AndroidPackageFormat=aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error

  # Signed iOS build uploaded to TestFlight. Setup and the secret/variable names: docs/deploy/testflight.md.
  # GitHub can't test `secrets` in a job-level `if`, so the first step checks them and every later step is gated on its
  # output: until everything is configured the job finishes green in seconds, names what is missing, and uploads nothing.
  ios-testflight:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 60
    # One upload at a time; a newer push waits rather than cancelling an upload in flight.
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      # CFBundleVersion "<run number>.<attempt>": unique and increasing for every run, and a re-run gets a higher attempt.
      # run_number restarts at 1 if this workflow file is renamed or recreated: then bump ApplicationDisplayVersion first.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      # Relative to $RUNNER_TEMP. A fixed path so the cleanup step can always remove the keychain, even when the import
      # step fails halfway.
      SIGNING_KEYCHAIN_NAME: signing.keychain-db
    steps:
      - name: Check signing configuration
        id: gate
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        # Names only: no value is ever printed.
        run: |
          missing=()
          for name in APPLE_API_KEY IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("secret $name"); fi
          done
          for name in ASC_KEY_ID ASC_ISSUER_ID API_BASE_URL; do
            if [ -z "${!name}" ]; then missing+=("variable $name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}")
            echo "::notice title=TestFlight upload skipped::Not configured yet. Missing: ${list%, }. See docs/deploy/testflight.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      # The csproj's ApplicationId is the bundle id. The optional APPLE_BUNDLE_ID secret is a cross-check only.
      - name: Read the bundle id
        id: bundle
        if: steps.gate.outputs.enabled == 'true'
        env:
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
        run: |
          bundle_id=$(sed -nE 's:.*<ApplicationId>([^<]+)</ApplicationId>.*:\1:p' src/CustomGolfStats.App/CustomGolfStats.App.csproj | head -n 1)
          if [ -z "$bundle_id" ]; then
            echo "::error title=No ApplicationId::src/CustomGolfStats.App/CustomGolfStats.App.csproj has no <ApplicationId>."
            exit 1
          fi
          if [ -n "$APPLE_BUNDLE_ID" ] && [ "$APPLE_BUNDLE_ID" != "$bundle_id" ]; then
            echo "::error title=Bundle id mismatch::The APPLE_BUNDLE_ID secret differs from <ApplicationId> in CustomGolfStats.App.csproj. Fix one of them (the csproj is what ships)."
            exit 1
          fi
          echo "id=$bundle_id" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          # Same pairing as the ios job: workload set 10.0.112 needs Xcode 26.6. Bump both together.
          xcode-version: '26.6'
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx
      # Restore evaluates every target framework, so both workloads are needed.
      - if: steps.gate.outputs.enabled == 'true'
        run: dotnet workload install ios android --version 10.0.112

      - name: Install the App Store Connect API key
        id: asc
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        # APPLE_API_KEY may hold the AuthKey_<id>.p8 text as is, or its base64.
        # altool finds AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys by itself.
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_${ASC_KEY_ID}.p8"
          (
            umask 077
            if printf '%s' "$APPLE_API_KEY" | grep -q -e '-----BEGIN PRIVATE KEY-----'; then
              printf '%s\n' "$APPLE_API_KEY" | tr -d '\r' > "$key"
            else
              printf '%s' "$APPLE_API_KEY" | tr -d ' \r\n' | base64 --decode > "$key" 2> /dev/null || true
            fi
          )
          if ! grep -q -e '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error title=APPLE_API_KEY invalid::APPLE_API_KEY must be the contents of AuthKey_<id>.p8, or its base64."
            exit 1
          fi
          echo "key-path=$key" >> "$GITHUB_OUTPUT"

      - name: Import the distribution certificate into a temporary keychain
        id: cert
        if: steps.gate.outputs.enabled == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/$SIGNING_KEYCHAIN_NAME"
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          p12="$RUNNER_TEMP/dist.p12"
          (umask 077; printf '%s' "$IOS_DIST_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$p12")
          # `security -p/-P` take passwords as arguments, so they show in the process list. Acceptable on a GitHub-hosted
          # runner (a fresh single-tenant VM per job); don't copy this to a shared or self-hosted machine.
          security import "$p12" -k "$keychain" -f pkcs12 -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          # Let codesign use the key without a UI prompt, and put the keychain on the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          # shellcheck disable=SC2086 # one path per line; none contain spaces on the runner
          security list-keychains -d user -s "$keychain" $existing
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"((Apple|iPhone) Distribution[^"]*)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error title=No distribution identity::IOS_DIST_CERT_P12 holds no Apple Distribution certificate with its private key."
            exit 1
          fi
          pem=$(security find-certificate -c "$identity" -p "$keychain")
          serial=$(printf '%s\n' "$pem" | openssl x509 -noout -serial | sed 's/^serial=//')
          sha1=$(printf '%s\n' "$pem" | openssl x509 -noout -fingerprint -sha1 | sed 's/^.*=//' | tr -d ':')
          echo "Signing with: $identity (serial $serial)"
          {
            # The generic prefix ("Apple Distribution") lets the build pick the identity that matches the profile, and keeps
            # team names with commas or semicolons off the MSBuild command line.
            echo "codesign-key=${identity%%:*}"
            echo "serial=$serial"
            echo "sha1=$sha1"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch or create the App Store provisioning profile
        id: profile
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.asc.outputs.key-path }}
          BUNDLE_ID: ${{ steps.bundle.outputs.id }}
          CERT_SHA1: ${{ steps.cert.outputs.sha1 }}
          CERT_SERIAL: ${{ steps.cert.outputs.serial }}
        run: ruby .github/scripts/asc_profile.rb

      - name: Build iOS (Release, device, signed IPA)
        if: steps.gate.outputs.enabled == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CODESIGN_KEY: ${{ steps.cert.outputs.codesign-key }}
          CODESIGN_PROVISION: ${{ steps.profile.outputs.profile-uuid }}
        # Platforms/iOS/Entitlements.plist (the Keychain access group) is applied through CodesignEntitlements, which
        # Uno.Sdk sets for every iOS build; the App Store profile must allow it, and it does without extra capabilities.
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:ApplicationVersion="$BUILD_NUMBER"
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$CODESIGN_PROVISION"
          -p:CodesignKeychain="$RUNNER_TEMP/$SIGNING_KEYCHAIN_NAME"
          -p:ArchiveOnBuild=false
          -p:BuildIpa=true

      - name: Find the IPA
        id: ipa
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ipa=$(find src/CustomGolfStats.App/bin/Release/net10.0-ios/ios-arm64/publish -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error title=No IPA::The publish step produced no .ipa."
            exit 1
          fi
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      # Kept for a week so a failed upload can be retried by hand (Transporter) without rebuilding. Anyone with read access
      # to this repository can download it; it holds the signed app and the API address, no secrets.
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IPA: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=Upload accepted::Build $BUILD_NUMBER was handed to App Store Connect. Apple processes it next and emails if it is rejected; check the TestFlight tab."

      - name: Remove the keychain and the API key
        if: always()
        run: |
          keychain="$RUNNER_TEMP/$SIGNING_KEYCHAIN_NAME"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain" || rm -f "$keychain"; fi
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"

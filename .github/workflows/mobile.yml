name: Mobile release builds

# Builds the iOS and Android Release apps on GitHub's macOS runners, which carry a current Xcode.
# Unsigned for now: signing (App Store Connect / Play upload keys) is added in phase 6.
# The API address comes from the repository variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.invalid/' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # .NET for iOS requires the exact Xcode major.minor it was built for. Workload set 10.0.101
          # (SDK 10.0.101, the same as the development Mac) ships iOS 26.1, so use the runner's Xcode 26.1.
          xcode-version: '26.1.1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.101
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android --version 10.0.101
      - name: Build iOS (Release, device, unsigned)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:EnableCodeSigning=false
          -p:ArchiveOnBuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-ios/ios-arm64/publish/
          if-no-files-found: warn

  android:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android
      - name: Build Android (Release AAB, debug-signed)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-android -c Release
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:AndroidPackageFormat=aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error

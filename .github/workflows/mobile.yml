name: Mobile release builds

# Builds the iOS and Android Release apps on GitHub's macOS runners, which carry a current Xcode.
# The ios and android jobs build unsigned (Android debug-signed) on every change, pull requests included.
# The ios-testflight job signs the iOS app and uploads it to TestFlight, on master and manual runs only, and only when the
# signing secrets exist in the `production` environment (forks, pull requests and repos without an Apple account skip it).
# Setup: docs/deploy/testflight.md.
# The API address comes from the variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables).

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'src/CustomGolfStats.App/**'
      - 'src/CustomGolfStats.App.Core/**'
      - 'src/CustomGolfStats.Domain/**'
      - 'src/CustomGolfStats.Api.Client/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.invalid/' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # .NET for iOS requires the exact Xcode major.minor it was built for, and actool needs a matching
          # simulator runtime. Workload set 10.0.112 ships iOS 26.5, which requires Xcode 26.6.
          # Bump both together when moving to a newer workload set.
          xcode-version: '26.6'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android --version 10.0.112
      - name: Build iOS (Release, device, unsigned)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:EnableCodeSigning=false
          -p:ArchiveOnBuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-ios/ios-arm64/publish/
          if-no-files-found: warn

  android:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Restore evaluates every target framework, so both workloads are needed.
      - run: dotnet workload install ios android
      - name: Build Android (Release AAB, debug-signed)
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-android -c Release
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:AndroidPackageFormat=aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: src/CustomGolfStats.App/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error

  # Signed iOS build uploaded to TestFlight. Setup and the secret names: docs/deploy/testflight.md.
  # GitHub can't test `secrets` in a job-level `if`, so the first step checks them and every later step is gated on its
  # output: without an Apple account the job finishes green in seconds and uploads nothing.
  ios-testflight:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: macos-26
    environment: production
    timeout-minutes: 60
    # One upload at a time; a newer push waits rather than cancelling an upload in flight.
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    env:
      BUNDLE_ID: com.customgolfstats.app
      # CFBundleVersion: unique and increasing for every run of this workflow. A re-run of the same run reuses the number and
      # App Store Connect rejects it, so start a new run instead (Actions > Mobile release builds > Run workflow).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check signing secrets
        id: gate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 5 ]; then
            echo "::notice title=TestFlight upload skipped::No App Store Connect secrets in the production environment. See docs/deploy/testflight.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=TestFlight secrets incomplete::Missing in the production environment: ${missing[*]}"
            exit 1
          fi
          if [ -z "$API_BASE_URL" ]; then
            echo "::error title=API_BASE_URL not set::A TestFlight build needs the production API address in the API_BASE_URL variable."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Same pairing as the ios job: workload set 10.0.112 needs Xcode 26.6. Bump both together.
          xcode-version: '26.6'
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.1xx
      # Restore evaluates every target framework, so both workloads are needed.
      - if: steps.gate.outputs.enabled == 'true'
        run: dotnet workload install ios android --version 10.0.112

      - name: Install the App Store Connect API key
        id: asc
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        # altool finds AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys by itself.
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_${ASC_KEY_ID}.p8"
          (umask 077; printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key")
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error title=ASC_KEY_P8 invalid::ASC_KEY_P8 must be the base64 of the AuthKey_<id>.p8 file (base64 -i AuthKey_<id>.p8)."
            exit 1
          fi
          echo "key-path=$key" >> "$GITHUB_OUTPUT"

      - name: Import the distribution certificate into a temporary keychain
        id: cert
        if: steps.gate.outputs.enabled == 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          p12="$RUNNER_TEMP/dist.p12"
          (umask 077; printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$p12")
          security import "$p12" -k "$keychain" -f pkcs12 -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          # Let codesign use the key without a UI prompt, and put the keychain on the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          # shellcheck disable=SC2086 # one path per line; none contain spaces on the runner
          security list-keychains -d user -s "$keychain" $existing
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.*"((Apple|iPhone) Distribution[^"]*)".*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error title=No distribution identity::IOS_DIST_CERT_P12 holds no Apple Distribution certificate with its private key."
            exit 1
          fi
          serial=$(security find-certificate -c "$identity" -p "$keychain" | openssl x509 -noout -serial | sed 's/^serial=//')
          echo "Signing with: $identity (serial $serial)"
          {
            echo "keychain=$keychain"
            # The generic prefix ("Apple Distribution") lets the build pick the identity that matches the profile, and keeps
            # team names with commas or semicolons off the MSBuild command line.
            echo "codesign-key=${identity%%:*}"
            echo "serial=$serial"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch or create the App Store provisioning profile
        id: profile
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.asc.outputs.key-path }}
          CERT_SERIAL: ${{ steps.cert.outputs.serial }}
        run: ruby .github/scripts/asc_profile.rb

      - name: Build iOS (Release, device, signed IPA)
        if: steps.gate.outputs.enabled == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CODESIGN_KEY: ${{ steps.cert.outputs.codesign-key }}
          CODESIGN_PROVISION: ${{ steps.profile.outputs.profile-uuid }}
          CODESIGN_KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: >
          dotnet publish src/CustomGolfStats.App/CustomGolfStats.App.csproj
          -f net10.0-ios -c Release -r ios-arm64
          -p:ApiBaseUrl="$API_BASE_URL"
          -p:ApplicationVersion="$BUILD_NUMBER"
          -p:CodesignKey="$CODESIGN_KEY"
          -p:CodesignProvision="$CODESIGN_PROVISION"
          -p:CodesignKeychain="$CODESIGN_KEYCHAIN"
          -p:ArchiveOnBuild=false
          -p:BuildIpa=true

      - name: Find the IPA
        id: ipa
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ipa=$(find src/CustomGolfStats.App/bin/Release/net10.0-ios/ios-arm64/publish -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$ipa" ]; then
            echo "::error title=No IPA::The publish step produced no .ipa."
            exit 1
          fi
          echo "path=$ipa" >> "$GITHUB_OUTPUT"

      # Kept for two weeks so a failed upload can be retried by hand (Transporter) without rebuilding.
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.gate.outputs.enabled == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IPA: ${{ steps.ipa.outputs.path }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=Uploaded to TestFlight::Build $BUILD_NUMBER is processing in App Store Connect (usually 5-30 minutes)."

      - name: Remove the keychain and the API key
        if: always() && steps.gate.outputs.enabled == 'true'
        env:
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"

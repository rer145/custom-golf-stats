name: Mobile probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/mobile-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    steps:
      - run: ls -d /Applications/Xcode*.app
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet --version
      - run: |
          for v in $(dotnet workload search version | head -12); do echo "== $v"; dotnet workload search version $v | grep -iE "ios|android"; done

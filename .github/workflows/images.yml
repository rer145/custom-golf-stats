name: Images

# Builds the API, migrator and web images for linux/amd64 and linux/arm64.
# Pull requests only build them (`build` job, read-only token). Pushes to master and manual runs build and push them to
# GHCR (`publish` job, the only one with `packages: write`), tagged with the commit SHA, plus `latest` from master:
#   ghcr.io/rer145/custom-golf-stats-api:<sha> / :latest
#   ghcr.io/rer145/custom-golf-stats-api:<sha>-migrator / :latest-migrator   (the EF Core migrations bundle)
#   ghcr.io/rer145/custom-golf-stats-web:<sha> / :latest
# The web image bakes in ALLOWED_HOSTS from the repository variable WEB_ALLOWED_HOSTS (the public web host name);
# publishing fails if it is not set.
# The .NET SDK and npm build stages run natively on the amd64 runner and cross-build; only the small target-platform
# steps of the arm64 images (apt-get in the API runtime, npm ci of production dependencies) run under QEMU.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/rer145/custom-golf-stats

jobs:
  build:
    name: build ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - name: api
            context: .
            file: src/CustomGolfStats.Api/Dockerfile
            target: api
            repository: api
            suffix: ""
          - name: migrator
            context: .
            file: src/CustomGolfStats.Api/Dockerfile
            target: migrator
            repository: api
            suffix: "-migrator"
          - name: web
            context: web
            file: web/Dockerfile
            target: runtime
            repository: web
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.name == 'web' && 'ALLOWED_HOSTS=pr-build.invalid' || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}

  publish:
    name: publish ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - name: Require WEB_ALLOWED_HOSTS
        if: matrix.name == 'web'
        env:
          ALLOWED_HOSTS: ${{ vars.WEB_ALLOWED_HOSTS }}
        run: |
          if [ -z "$ALLOWED_HOSTS" ]; then
            echo "::error::Set the repository variable WEB_ALLOWED_HOSTS to the public web host name; without it every web sign-in is refused with 403."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.repository }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$GITHUB_SHA$SUFFIX"
            # Only master moves `latest`; a manual run on another branch pushes just its SHA tag.
            if [ "$GITHUB_REF" = "refs/heads/master" ]; then echo "$IMAGE:latest$SUFFIX"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.name == 'web' && format('ALLOWED_HOSTS={0}', vars.WEB_ALLOWED_HOSTS) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

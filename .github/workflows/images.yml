name: Images

# Builds the API, migrator, web and Postgres (+ WAL-G) images for linux/amd64 and linux/arm64.
# Pull requests only build them (`build` job, read-only token). Pushes to master and manual runs build and push them to
# GHCR (`publish` job, the only one with `packages: write`), tagged with the commit SHA, plus `latest` from master:
#   ghcr.io/rer145/custom-golf-stats-api:<sha> / :latest
#   ghcr.io/rer145/custom-golf-stats-api:<sha>-migrator / :latest-migrator   (the EF Core migrations bundle)
#   ghcr.io/rer145/custom-golf-stats-web:<sha> / :latest
#   ghcr.io/rer145/custom-golf-stats-postgres:pg-<hash> + :<sha> / :latest   (deploy/postgres)
# The Postgres image's deploys use its content tag pg-<hash> (deploy/postgres-tag.sh, a hash of deploy/postgres), so a
# deploy restarts Postgres only when deploy/postgres changed. Every publish makes sure that tag exists. A content tag
# is never rebuilt: when it is already on GHCR, the existing image just gets the <sha> (and latest) tags as well, so
# the image a deploy pulls under pg-<hash> never changes. To pick up a new base image, change deploy/postgres (e.g. bump
# the pinned postgres version).
# The web image bakes in ALLOWED_HOSTS from the repository variable WEB_ALLOWED_HOSTS (the public web host name);
# publishing fails if it is not set.
# The .NET SDK and npm build stages run natively on the amd64 runner and cross-build; only the small target-platform
# steps of the arm64 images (apt-get in the API runtime, npm ci of production dependencies) run under QEMU.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/rer145/custom-golf-stats

jobs:
  build:
    name: build ${{ matrix.name }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - name: api
            context: .
            file: src/CustomGolfStats.Api/Dockerfile
            target: api
            repository: api
            suffix: ""
          - name: migrator
            context: .
            file: src/CustomGolfStats.Api/Dockerfile
            target: migrator
            repository: api
            suffix: "-migrator"
          - name: web
            context: web
            file: web/Dockerfile
            target: runtime
            repository: web
            suffix: ""
          - name: postgres
            context: deploy/postgres
            file: deploy/postgres/Dockerfile
            target: runtime
            repository: postgres
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.name == 'web' && 'ALLOWED_HOSTS=pr-build.invalid' || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}

  publish:
    name: publish ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - name: Require WEB_ALLOWED_HOSTS
        if: matrix.name == 'web'
        env:
          ALLOWED_HOSTS: ${{ vars.WEB_ALLOWED_HOSTS }}
        run: |
          if [ -z "$ALLOWED_HOSTS" ]; then
            echo "::error::Set the repository variable WEB_ALLOWED_HOSTS to the public web host name; without it every web sign-in is refused with 403."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.repository }}
          SUFFIX: ${{ matrix.suffix }}
          NAME: ${{ matrix.name }}
        run: |
          tags=("$IMAGE:$GITHUB_SHA$SUFFIX")
          # Only master moves `latest`; a manual run on another branch pushes just its SHA tag.
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then tags+=("$IMAGE:latest$SUFFIX"); fi
          existing=""
          if [ "$NAME" = "postgres" ]; then
            content="$IMAGE:$(deploy/postgres-tag.sh)"
            if out="$(docker buildx imagetools inspect "$content" 2>&1)"; then
              existing="$content"
              echo "$content is already published; tagging it instead of rebuilding."
            elif grep -qi 'not found' <<<"$out"; then
              tags+=("$content")
            else
              echo "::error::Could not check whether $content exists: $out"
              exit 1
            fi
          fi
          {
            echo "existing=$existing"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the published content tag
        if: steps.tags.outputs.existing != ''
        env:
          EXISTING: ${{ steps.tags.outputs.existing }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do [ -z "$tag" ] || args+=(--tag "$tag"); done <<<"$TAGS"
          docker buildx imagetools create "${args[@]}" "$EXISTING"

      - uses: docker/build-push-action@v6
        if: steps.tags.outputs.existing == ''
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ matrix.name == 'web' && format('ALLOWED_HOSTS={0}', vars.WEB_ALLOWED_HOSTS) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

# Overlay for deploy/backup/drill.sh (used with ../compose.yaml): adds a MinIO server as the backup storage and builds
# the Postgres + WAL-G image from deploy/postgres. Paths are relative to deploy/ (the project directory).
services:
  minio:
    # MinIO no longer publishes images; pgsty/minio is the community build of the same server. Pinned by digest.
    image: ${DRILL_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    command: ["server", "--quiet", "/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio:/data
    networks: [backup]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    build:
      context: postgres
      target: runtime
    depends_on:
      minio:
        condition: service_healthy
  pg-backup:
    build:
      context: postgres
      target: runtime
  restore:
    build:
      context: postgres
      target: runtime

volumes:
  minio:
